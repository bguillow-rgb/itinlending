name: Daily SEO content

# Generates one research-backed, schema-compliant article per day, rebuilds the
# site into /docs (GitHub Pages), commits, pushes, and pings IndexNow.
# Manual runs are allowed via the "Run workflow" button.
on:
  # 3x/week content pipeline (Mon flagship + Wed/Fri cluster). Re-enabled
  # 2026-07-05 per owner decision; the flagship/cluster upgrade is the remediation
  # for the AdSense "low value content" flag (review still pending). To re-pause,
  # comment out the two schedule lines below.
  schedule:
    - cron: '0 13 * * 1,3,5' # 13:00 UTC Mon/Wed/Fri (Mon run = flagship)
  workflow_dispatch:
    inputs:
      tier:
        description: 'Force tier (flagship or detail). Leave empty for auto-by-weekday.'
        required: false
        default: ''

permissions:
  contents: write
  issues: write # the notify job opens/updates the pipeline-failure issue

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the sitemap dates each static page from the commit
          # that last touched its source. The default depth-1 checkout would
          # leave those blank.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Fail fast and unambiguously when the API key is out of credit or invalid,
      # instead of burning three generateArticle retries and dying with a message
      # nobody reads. See scripts/preflight-api.mjs for the 2026-07-29 incident
      # this was written for. Transient errors here do not block the run.
      - name: Preflight — Anthropic API funded + reachable
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/preflight-api.mjs

      - name: Generate today's article
        id: write
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAILY_POST_TIER: ${{ github.event.inputs.tier }}
        run: node scripts/daily-post.mjs

      # Fill any missing es-419 translations and refresh the relatedSlugs mesh.
      # Runs every day so existing articles get translated and the internal-link
      # mesh stays complete even on days no new article is published. Skips
      # articles that already have a translation (no --force), so it's cheap.
      - name: Backfill ES translations + relink
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/backfill.mjs

      # Commit if EITHER a new article was written OR the backfill changed any
      # content (new translations, relinked siblings).
      - name: Detect content changes
        id: changes
        working-directory: .
        run: |
          if [ "${{ steps.write.outputs.wrote }}" = "true" ] || \
             ! git diff --quiet -- web/src/content; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + deploy to /docs
        if: steps.changes.outputs.changed == 'true'
        # The build bakes PUBLIC_* vars into the static HTML. .env is gitignored
        # and absent in CI, so without these the rebuilt /docs would lose AdSense
        # + GA4. All values below are public identifiers already shipped in the
        # site's HTML (not secrets), so they live here as literals.
        env:
          PUBLIC_ADSENSE_ID: ca-pub-1426577294682977
          PUBLIC_GA4_ID: G-YVKK4MXGVP
          PUBLIC_GSC_VERIFICATION: CvVq2ULyJsWJwR6FRFS9VAH45TO2nuQQ3YF9sL9tRyE
          PUBLIC_LEAD_ENDPOINT: https://qnthujurzakdmngcidsg.supabase.co/functions/v1/lead
          PUBLIC_WEB3FORMS_KEY:
          PUBLIC_AFFILIATE_URL_AUTO_COMPARE: https://www.tkqlhce.com/click-101772772-10608154
          PUBLIC_ADSENSE_SLOT_ARTICLE_TOP: '7717297356'
          PUBLIC_ADSENSE_SLOT_ARTICLE_END: '3778052348'
          PUBLIC_ADSENSE_SLOT_MONEY_FOOTER: '4109224835'
          PUBLIC_ADSENSE_SLOT_THANKYOU: '1151889001'
          # TrustedForm consent-cert capture (ActiveProspect acct created
          # 2026-08-06, free Certify tier). Keyless script; certs attribute by
          # domain. Loads on the lead form and fills xxTrustedFormCertUrl/PingUrl.
          PUBLIC_TRUSTEDFORM_ENABLED: 'true'
          # MarketCall campaign #350784 (Spanish Personal Loans, approved
          # 2026-08-07). Swaps the ES lead form + loan CTAs for this tracked
          # click-out. Remove/empty to restore the ES form.
          PUBLIC_MARKETCALL_PERSONAL_ES: 'https://trkmcl.com/wy8om1m43k/z41kkw99nm'
          PUBLIC_MARKETCALL_FINALEXPENSE_PHONE: '(844) 833-2205'
        run: bash scripts/deploy-to-docs.sh

      - name: Ping IndexNow
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/indexnow.mjs || true

      # Push the new article straight to Google's Indexing API so it gets spidered
      # ASAP instead of waiting for sitemap rediscovery. Only fires when a NEW
      # article was written today (not on es-backfill-only days). No-ops cleanly
      # until GOOGLE_INDEXING_SA_KEY is set. See scripts/google-index.mjs for the
      # service-account / owner-verification requirements + policy caveat.
      - name: Ping Google Indexing API
        if: steps.write.outputs.slug != ''
        env:
          GOOGLE_INDEXING_SA_KEY: ${{ secrets.GOOGLE_INDEXING_SA_KEY }}
        run: node scripts/google-index.mjs --article "${{ steps.write.outputs.slug }}" || true

      - name: Commit & push
        if: steps.changes.outputs.changed == 'true'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs web/src/content
          git commit -m "Daily content: ${{ steps.write.outputs.slug || 'es backfill + relink' }}"
          # These repos get concurrent pushes (parallel sessions), so rebase and
          # retry to survive non-fast-forward rejections.
          #
          # The retry loop used to just re-run `git pull --rebase`. That works for
          # a plain non-fast-forward, but not for a CONFLICT: the rebase stops
          # with unmerged files, and every later attempt then dies on "Pulling is
          # not possible because you have unmerged files." One conflict poisoned
          # all five attempts. On 2026-08-18 that lost a slot whose article had
          # already been generated, repaired to fit the SERP budget, and passed
          # every build gate — the run failed at the very last step.
          #
          # Two changes: clear any half-finished rebase before each attempt, and
          # resolve the one path that routinely conflicts.
          for i in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true

            if git pull --rebase --autostash origin main; then
              git push && exit 0
            elif [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              # docs/ is generated output (deploy-to-docs.sh wipes and rewrites
              # it), so two publishes always differ there and there is nothing to
              # merge. Take our freshly built copy. Anything else conflicting is
              # real source: refuse rather than silently clobber someone's work.
              if git diff --name-only --diff-filter=U | grep -qv '^docs/'; then
                echo "::error::Rebase conflict outside docs/ — refusing to auto-resolve:"
                git diff --name-only --diff-filter=U | grep -v '^docs/'
                git rebase --abort 2>/dev/null || true
                exit 1
              fi
              # During a rebase --theirs is the commit being replayed, i.e. ours.
              git checkout --theirs -- docs 2>/dev/null || true
              git add -A docs
              GIT_EDITOR=true git rebase --continue >/dev/null 2>&1 || true
              git push && exit 0
            fi

            echo "push attempt $i failed (likely a concurrent push) — retrying"
            sleep 5
          done
          echo "::error::Could not push after 5 attempts"
          exit 1

  # A failed publish used to be completely silent: the site stayed up, so the
  # site health monitor and Lighthouse CI both reported green while the pipeline
  # was dead. Two slots (2026-07-29, 07-31) were lost to an out-of-credit API key
  # before anyone noticed, a week later, reading run history by hand.
  # This job makes every failure land somewhere a human sees it.
  notify:
    needs: publish
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open or update the pipeline-failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Daily SEO content pipeline is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Pull the failed step names so the issue says WHAT broke, not just THAT it broke.
            let failedSteps = [];
            try {
              const { data } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
              for (const job of data.jobs) {
                for (const step of job.steps || []) {
                  if (step.conclusion === 'failure') failedSteps.push(`${job.name} → ${step.name}`);
                }
              }
            } catch (e) {
              core.warning(`could not read job steps: ${e.message}`);
            }

            const preflightFailed = failedSteps.some((s) => s.includes('Preflight'));
            const hint = preflightFailed
              ? '**Most likely cause: the Anthropic API key is out of credit or invalid.** ' +
                'The preflight step is the one that failed. Top up at console.anthropic.com → ' +
                'Plans & Billing. This key funds the generator on **all three** ITIN repos, so ' +
                'itincreditcard.com and itincreditscore.com are almost certainly down too.'
              : 'Check the run log. Common causes: the `check-links` build gate catching broken ' +
                'internal links or ES→EN locale leaks in the generated article (this fails the ' +
                'build on purpose — fix the links, do not disable the gate), or a push conflict.';

            const body = [
              `The \`Daily SEO content\` workflow failed on ${new Date().toISOString().slice(0, 10)}.`,
              '',
              `**Run:** ${runUrl}`,
              failedSteps.length ? `**Failed steps:**\n${failedSteps.map((s) => `- ${s}`).join('\n')}` : '',
              '',
              hint,
              '',
              '**This means today\'s article did not publish.** After fixing the cause, re-run the ' +
              'workflow manually (Actions → Daily SEO content → Run workflow) to recover the slot.',
            ].filter(Boolean).join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pipeline-failure',
            });

            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              core.notice(`Commented on existing issue #${existing.data[0].number}`);
            } else {
              // Ensure the label exists before using it (first run on a fresh repo).
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'pipeline-failure',
                  color: 'b60205',
                  description: 'Daily content pipeline failed',
                });
              } catch (e) { /* already exists */ }

              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['pipeline-failure'],
              });
              core.notice(`Opened issue #${created.data.number}`);
            }
